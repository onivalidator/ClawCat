# ClawCat Configuration
# Copy this file to config.yaml and fill in your values

telegram:
  # Get your bot token from @BotFather on Telegram
  bot_token: "YOUR_BOT_TOKEN_HERE"

  # Your Telegram user ID (get it from @userinfobot)
  # This is the ONLY user who can control the bot
  authorized_user_id: 123456789

claude:
  # Path to Claude CLI executable
  executable: "C:\\Users\\kevin\\.local\\bin\\claude.exe"

  # Working directory for Claude commands
  working_dir: "C:\\Users\\kevin"

  # Maximum time to wait for a command (in seconds)
  timeout_seconds: 300

  # Claude model to use - aliases auto-map to latest versions
  # Available models:
  #   opus   - Opus 4.5 (claude-opus-4-5-20251101) - State-of-the-art, recommended
  #   sonnet - Sonnet 4.5 (claude-sonnet-4-5-20250929) - Fast daily coding
  #   haiku  - Haiku 4.5 (claude-haiku-4-5-20251001) - Fastest, simple tasks
  model: "opus"
