# ClawCat Configuration
# Copy this file to config.yaml and fill in your values

telegram:
  # Get your bot token from @BotFather on Telegram
  bot_token: "YOUR_BOT_TOKEN_HERE"

  # Your Telegram user ID (get it from @userinfobot)
  # This is the ONLY user who can control the bot
  authorized_user_id: 123456789

agent:
  # Path to Codex CLI executable
  executable: "codex"

  # Working directory for Codex commands
  working_dir: "C:\\ClawCat\\Workspace"

  # Maximum time to wait for a command (in seconds)
  timeout_seconds: 300

  # Codex model to use - aliases auto-map to latest versions
  # Available models:
  #   gpt-5.1-codex   - GPT-5.1 Codex (gpt-5.1-codex) - State-of-the-art, recommended
  #   gpt-5.1 - GPT-5.1 (gpt-5.1) - Fast daily coding
  #   gpt-5  - GPT-5 (gpt-5) - Fastest, simple tasks
  model: "gpt-5.1-codex"

  # Open a monitor window on the desktop when a new session starts
  # Set to false to disable (useful when running as a service)
  open_monitor_window: true

  # Show Codex CLI in a visible terminal window
  # When enabled, each Codex command runs in a visible PowerShell window
  # so you can see the work in progress (useful for remote monitoring via AnyDesk, etc.)
  visible_terminal: false
